<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sioncronaich — cron job monitor</title>
  <script src="{{ request.url_for('static', path='htmx.min.js') }}"></script>
  <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}" />
</head>

<body>

  <h1><a href="{{ request.url_for('dashboard') }}">sion<span class="cron">cron</span>aich</a></h1>
  <!-- filter form — htmx partial updates keep focus while typing -->
  <form class="filters" id="filter-form" hx-get="{{ request.url_for('table_partial') }}" hx-target="#results"
    hx-trigger="input delay:400ms from:[type='search'], change from:select, submit" hx-push-url="false">
    <input type="hidden" name="limit" value="{{ limit }}" />
    <input type="hidden" name="offset" value="0" />
    <input name="job_name" type="search" placeholder="Job name…" value="{{ job_name }}" />
    <input name="hostname" type="search" placeholder="Host…" value="{{ hostname }}" />
    <select name="status">
      <option value="" {% if status=="" %}selected{% endif %}>All statuses</option>
      <option value="ok" {% if status=="ok" %}selected{% endif %}>OK</option>
      <option value="err" {% if status=="err" %}selected{% endif %}>ERR</option>
    </select>
    <input name="command" type="search" placeholder="Command…" value="{{ command }}" />
    <button type="submit">filter</button>
    <a class="clear-link" href="{{ request.url_for('dashboard') }}?limit={{ limit }}">✕ clear</a>
  </form>

  <div id="results">
    {% include "table.html" %}
  </div>

</body>

</html>
